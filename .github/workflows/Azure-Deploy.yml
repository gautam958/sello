# Build and deploy Node.js app to Azure Web App - sello
name: Build and deploy Node.js app to Azure Web App - sello

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" # or 20 LTS

      - name: Install dependencies
        run: npm install

      - name: Archive production files
        run: Compress-Archive -Path . -DestinationPath release.zip

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: sello
          path: release.zip

  deploy:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: sello

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F4CB15F87EC048119BC6532EF41193FB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_907930C516084B18B1BDBA3FCDA99B17 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4681AB9DDCED4490A5CE0CB1BE878558 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "sello"
          slot-name: "Production"
          package: release.zip
