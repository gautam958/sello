<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sello - Marketplace</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header>
      <a href="index.html" class="logo">Sello</a>
      <nav id="nav-menu"></nav>
    </header>

    <div class="marquee">
      <span
        >All Items Pick From Tung Chung ( Coastal Skyline) Once Admin Confirm
        The Items you will received and detailed instruction , Pickup must be
        before 16-June-2026.</span
      >
    </div>

    <main class="container">
      <h2 style="margin-bottom: 1.5rem">Available Items</h2>
      <div id="items-grid" class="grid"></div>
    </main>

    <div id="bid-modal" class="bid-modal" style="display: none">
      <div class="modal-content">
        <span class="close-btn" id="modal-cancel-btn">&times;</span>
        <h2>Place Your Bid</h2>
        <div class="bid-info">
          <p><strong>Item:</strong> <span id="modal-item-name"></span></p>
          <p>
            <strong>Minimum Price:</strong> <span id="modal-item-price"></span>
          </p>
          <p>
            <strong>Current Highest Bid:</strong>
            <span id="modal-highest-bid"></span>
          </p>
        </div>
        <div class="form-group">
          <label for="bid-amount">Your Bid Amount (HK$)</label>
          <input type="number" id="bid-amount" step="0.01" min="0" required />
        </div>
        <div style="display: flex; gap: 1rem; justify-content: center">
          <button id="modal-submit-btn" class="btn">Place Bid</button>
          <button
            id="modal-cancel-btn-button"
            class="btn"
            style="background-color: #64748b"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <!-- Image lightbox -->
    <div
      id="image-lightbox"
      class="lightbox"
      style="display: none"
      onclick="this.style.display = 'none'"
    >
      <img id="lightbox-img" src="" alt="Full image" />
    </div>

    <script src="script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        initApp("market");
      });
    </script>
  </body>
</html>
