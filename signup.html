<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sello - Register</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header>
      <a href="index.html" class="logo">Sello</a>
      <nav id="nav-menu"></nav>
    </header>

    <div class="marquee">
      <span
        >🚚 Move‑Out Sale! All items pickup from Coastal Skyline, Tung Chung –
        all bids are considered and once owner confirm you will received
        detailed instructions on your email, signup and book your items, pickup
        before 16 June 2026.</span
      >
    </div>

    <main class="container">
      <div class="form-container">
        <h2 style="margin-bottom: 1.5rem; text-align: center">
          Create an Account
        </h2>
        <form id="signup-form">
          <div class="form-group">
            <label for="signup-username">Username</label>
            <input type="text" id="signup-username" required />
          </div>
          <div class="form-group">
            <label for="signup-email">Email Address</label>
            <input type="email" id="signup-email" required />
          </div>
          <div class="form-group">
            <label for="signup-mobile">Mobile Number</label>
            <input
              type="tel"
              id="signup-mobile"
              required
              placeholder="e.g. +852 9123 4567"
            />
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" required />
          </div>
          <div class="form-group">
            <label for="signup-confirm-password">Confirm Password</label>
            <input type="password" id="signup-confirm-password" required />
          </div>
          <button type="submit" class="btn" style="width: 100%">
            Register
          </button>
          <p style="margin-top: 1rem; text-align: center">
            Already have an account?
            <a
              href="login.html"
              style="color: var(--primary-color); font-weight: 600"
              >Sign in</a
            >
          </p>
          <p
            id="signup-error"
            style="
              color: var(--danger-color);
              margin-top: 1rem;
              text-align: center;
              display: none;
            "
          ></p>
        </form>
      </div>
    </main>

    <script src="script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        initApp("signup");
      });
    </script>
  </body>
</html>
