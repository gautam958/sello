<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sello - Marketplace</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="index.html" class="logo">Sello</a>
      <nav id="nav-menu"></nav>
    </header>

    <main class="container">
      <h2 style="margin-bottom: 1.5rem">Available Items</h2>
      <div id="items-grid" class="grid"></div>
    </main>

    <div id="bid-modal" class="bid-modal" style="display: none">
      <div class="modal-content">
        <span class="close-btn" id="modal-cancel-btn">&times;</span>
        <h2>Place Your Bid</h2>
        <div class="bid-info">
          <p><strong>Item:</strong> <span id=\"modal-item-name\"></span></p>
          <p><strong>Minimum Price:</strong> <span id=\"modal-item-price\"></span></p>
          <p><strong>Current Highest Bid:</strong> <span id=\"modal-highest-bid\"></span></p>
        </div>
        <div class="form-group">
          <label for="bid-amount">Your Bid Amount ($)</label>
          <input type="number" id="bid-amount" step="0.01" min="0" required />
        </div>
        <div style="display: flex; gap: 1rem; justify-content: center">
          <button id="modal-submit-btn" class="btn">Place Bid</button>
          <button id="modal-cancel-btn-button" class="btn" style="background-color: #64748b">Cancel</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        initApp("market");
      });
    </script>
  </body>
</html>
